<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Página de ejemplo · Comanda IA</title>
<style>
  :root { --c: #d9480f; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.5 Georgia, "Times New Roman", serif; color: #2b2118; background: #fffaf3; }
  .note { background: #1d1b18; color: #fff; font: 13px/1.4 system-ui, sans-serif; padding: 10px 16px; text-align: center; }
  .note b { color: #ffd8a8; }
  header { padding: 18px 24px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #f0e6d8; }
  header strong { font-size: 22px; }
  header nav a { margin-left: 18px; color: inherit; text-decoration: none; font-family: system-ui, sans-serif; font-size: 15px; }
  .hero { padding: 72px 24px; text-align: center; background: linear-gradient(180deg, #fff1e0, #fffaf3); }
  .hero h1 { font-size: clamp(34px, 6vw, 58px); margin: 0 0 10px; }
  .hero p { font-size: 19px; color: #6b5a48; margin: 0 0 24px; }
  .hero .cta { display: inline-block; background: var(--c); color: #fff; padding: 14px 26px; border-radius: 999px; font: 600 16px system-ui, sans-serif; text-decoration: none; }
  .menu { max-width: 900px; margin: 0 auto; padding: 48px 24px 120px; }
  .menu h2 { text-align: center; font-size: 30px; }
  .dishes { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 18px; }
  .dish { background: #fff; border: 1px solid #f0e6d8; border-radius: 14px; padding: 18px; }
  .dish b { display: flex; justify-content: space-between; gap: 8px; font-size: 18px; }
  .dish span { color: var(--c); font-family: system-ui, sans-serif; }
  .dish p { margin: 6px 0 0; color: #6b5a48; font-size: 15px; }
  footer { text-align: center; padding: 24px; color: #8a7a68; font: 14px system-ui, sans-serif; }
</style>
</head>
<body>
  <div class="note">Esta es una <b>página de ejemplo</b> de un restaurante. El botón de abajo a la derecha es el chat de Comanda IA, instalado con una sola línea de código.</div>
  <header><strong id="name">Restaurante</strong><nav><a href="#menu">Menú</a><a href="#">Ubicación</a></nav></header>
  <section class="hero">
    <h1 id="title">Sabor de casa en Miami</h1>
    <p id="addr">Pide en línea y recoge en minutos.</p>
    <a class="cta" href="#" id="order">Ordenar ahora</a>
  </section>
  <section class="menu" id="menu">
    <h2>Los favoritos de la casa</h2>
    <div class="dishes" id="dishes"></div>
  </section>
  <footer>© Restaurante de ejemplo</footer>
<script>
  const rid = new URLSearchParams(location.search).get('r') || 'el-rincon-latino';
  const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  fetch('/api/chat/config?restaurante=' + encodeURIComponent(rid)).then((r) => r.json()).then((c) => {
    document.title = c.nombre;
    document.getElementById('name').textContent = c.nombre;
    document.getElementById('title').textContent = c.nombre;
    document.getElementById('addr').textContent = c.direccion + ' · Pide en línea y recoge en minutos.';
    document.documentElement.style.setProperty('--c', c.color);
    document.getElementById('dishes').innerHTML = (c.destacados || []).map((d) =>
      `<div class="dish"><b>${esc(d.nombre)} <span>$${Number(d.precio).toFixed(2)}</span></b>${d.descripcion ? `<p>${esc(d.descripcion)}</p>` : ''}</div>`).join('');
  });
  // Así se instala el chat: una sola etiqueta <script>
  const s = document.createElement('script');
  s.src = '/widget.js';
  s.dataset.restaurante = rid;
  s.async = true;
  document.body.appendChild(s);
  document.getElementById('order').onclick = (e) => { e.preventDefault(); document.querySelector('div[style*="2147483000"]')?.shadowRoot.querySelector('.launch')?.click(); };
</script>
</body>
</html>
