<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Comanda IA · Pedidos</title>
<link rel="stylesheet" href="/common.css" />
<style>
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 8px; }
  .stat b { display: block; font-size: 24px; } .stat small { color: var(--muted); }
  .orders { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
  .order { border-left: 5px solid var(--info); }
  .order.preparando { border-left-color: var(--warn); } .order.listo { border-left-color: var(--ok); }
  .order.entregado, .order.cancelado { opacity: .55; }
  .order .head { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
  .order h3 { margin: 0; font-size: 17px; }
  .order ul { padding-left: 18px; margin: 10px 0; } .meta { color: var(--muted); font-size: 13px; }
  .nota { color: var(--accent); font-size: 13px; }
  .btns { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  details.call { margin-bottom: 8px; padding: 10px 14px; }
  summary { cursor: pointer; } .msg { margin: 6px 0; } .msg.agente { color: var(--muted); }
</style>
</head>
<body>
<header class="top"></header>
<main>
  <section class="stats" id="stats"></section>
  <h2>Pedidos</h2>
  <section class="orders" id="orders"></section>
  <h2>Llamadas recientes</h2>
  <section id="calls"></section>
</main>
<script type="module">
  import { api, esc, money, setupTop } from '/common.js';

  const $ = (id) => document.getElementById(id);
  const NEXT = { nuevo: 'preparando', preparando: 'listo', listo: 'entregado' };
  const LABEL = { preparando: 'Empezar', listo: 'Marcar listo', entregado: 'Entregado' };
  let restaurante = '';

  function line(l) {
    const opts = Object.values(l.opciones || {});
    let t = `${l.cantidad} x ${l.nombre}`;
    if (opts.length) t += ` (${opts.join(', ')})`;
    if (l.extras?.length) t += ` con ${l.extras.join(' y ')}`;
    return `${esc(t)}${l.nota ? `<div class="nota">${esc(l.nota)}</div>` : ''}`;
  }

  async function load() {
    const q = `?restaurante=${encodeURIComponent(restaurante)}`;
    const [s, orders, calls] = await Promise.all([api('/api/estadisticas' + q), api('/api/pedidos' + q), api('/api/llamadas' + q)]);

    $('stats').innerHTML = [
      ['Llamadas atendidas', s.llamadas], ['Pedidos tomados', s.pedidos], ['Ventas por teléfono', money(s.ventas)],
      ['Ticket promedio', money(s.ticket_promedio)], ['Fuera de horario', s.fuera_de_horario], ['Pasadas a una persona', s.transferidas],
    ].map(([k, v]) => `<div class="card stat"><b>${v}</b><small>${k}</small></div>`).join('');

    $('orders').innerHTML = orders.length ? orders.slice(0, 30).map((o) => `
      <article class="card order ${esc(o.estado)}">
        <div class="head"><h3>#${esc(o.numero)} · ${esc(o.cliente)}</h3><span class="tag">${esc(o.estado)}</span></div>
        <div class="meta">Recoge ${esc(o.listo_a_las)} · ${esc(o.telefono || '')}</div>
        <ul>${o.lineas.map((l) => `<li>${line(l)}</li>`).join('')}</ul>
        <b>${money(o.total)}</b>
        <div class="btns">
          ${NEXT[o.estado] ? `<button class="primary" data-id="${esc(o.id)}" data-estado="${NEXT[o.estado]}">${LABEL[NEXT[o.estado]]}</button>` : ''}
          ${!['entregado', 'cancelado'].includes(o.estado) ? `<button data-id="${esc(o.id)}" data-estado="cancelado">Cancelar</button>` : ''}
        </div>
      </article>`).join('') : '<p class="empty">Todavía no hay pedidos.</p>';

    $('calls').innerHTML = calls.length ? calls.slice(0, 30).map((c) => `
      <details class="card call">
        <summary>${esc(new Date(c.inicio).toLocaleString('es-US'))} · ${esc(c.telefono || 'desconocido')}
          <span class="tag">${esc(c.resultado)}</span>${c.idioma === 'en' ? ' <span class="tag">inglés</span>' : ''}</summary>
        ${(c.conversacion || []).map((m) => `<p class="msg ${esc(m.rol)}"><b>${m.rol === 'cliente' ? 'Cliente' : 'IA'}:</b> ${esc(m.texto)}</p>`).join('')}
      </details>`).join('') : '<p class="empty">Todavía no hay llamadas.</p>';
  }

  $('orders').addEventListener('click', async (e) => {
    const b = e.target.closest('button[data-id]');
    if (!b) return;
    await api(`/api/pedidos/${encodeURIComponent(b.dataset.id)}/estado`, { method: 'POST', body: JSON.stringify({ estado: b.dataset.estado }) });
    load();
  });

  try {
    restaurante = await setupTop('index.html', (id) => { restaurante = id; load(); });
    await load();
    setInterval(load, 5000);
  } catch {
    document.querySelector('main').innerHTML = '<p>No autorizado. Abre el panel con ?token=TU_TOKEN</p>';
  }
</script>
</body>
</html>
